[project]
name = "unbake"
version = "0.1.0"
description = "Turn any video effect into an open ComfyUI recipe you can run on your own photo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "comfy-sdk>=0.5.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.14.2",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.scripts]
unbake = "unbake.server:main"

[tool.ruff.lint.per-file-ignores]
# FastAPI's File() defaults, and the two places an HTTP handler must survive any failure.
"src/unbake/server.py" = ["B008", "BLE001"]

[tool.ruff]
extend-exclude = ["notebooks"]
